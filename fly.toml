# Fly.io config for the web app. Deployed by .github/workflows/app.yml on push to main.
# The app name can be overridden with the FLY_APP repository variable.
app = "padelstats-kleist"
primary_region = "fra"  # Frankfurt — same region as the Neon database (aws-eu-central-1)

[deploy]
  # Runs database migrations in a temporary machine before the new version goes live.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle and start it on the next request: we only pay while it runs.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
