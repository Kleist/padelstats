<style>
  .app-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .app-bar .btn {
    background: var(--accent); color: var(--bg); border-radius: 8px; padding: 0.6rem 1.1rem;
    font-weight: 700; text-decoration: none;
  }
  .app-bar .notice { color: var(--green); }
  .app-bar .spacer { flex: 1; }
  .app-bar .btn-link { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
  .app-bar .version { color: var(--muted); font-size: 0.75rem; }
</style>
<div class="app-bar">
  <a class="btn" href="/ny">+ Indtast kamp</a>
  {% if saved %}<span class="notice">Kampen er gemt ✓</span>{% endif %}
  <span class="spacer"></span>
  {% if logged_in %}<form method="post" action="/logout"><button class="btn-link" type="submit">Log ud</button></form>{% endif %}
  <span class="version">version {{ version[:7] }}</span>
</div>
