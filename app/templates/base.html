<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>{% block title %}Padel Stats{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 1rem; max-width: 640px; margin: 0 auto;
  }
  a { color: var(--accent); }
  h1 { font-size: 1.6rem; margin-bottom: 1rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  header h1 { margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
  .btn {
    display: inline-block; background: var(--accent); color: var(--bg); border: 0; border-radius: 8px;
    padding: 0.75rem 1.25rem; font-size: 1rem; font-weight: 700; text-decoration: none; cursor: pointer;
  }
  .btn-block { display: block; width: 100%; text-align: center; }
  .btn-link { background: none; border: 0; color: var(--muted); font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
  label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.25rem; }
  input, select {
    width: 100%; font-size: 1.1rem; padding: 0.6rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
  .field { margin-bottom: 0.75rem; }
  .errors { border-color: var(--red); color: var(--red); }
  .notice { border-color: var(--green); color: var(--green); }
  .match { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
  .match:last-child { border-bottom: 0; }
  .meta { color: var(--muted); font-size: 0.8rem; }
  .win { color: var(--green); font-weight: 600; }
  .score { font-variant-numeric: tabular-nums; white-space: nowrap; }
  footer { color: var(--muted); font-size: 0.75rem; margin-top: 2rem; text-align: center; }
</style>
</head>
<body>
{% block content %}{% endblock %}
<footer>version {{ version[:7] }}</footer>
</body>
</html>
