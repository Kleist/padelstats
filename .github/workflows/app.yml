name: Web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLY_APP: ${{ vars.FLY_APP || 'padelstats-kleist' }}
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: padel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root --extras dev

      - name: Lint
        run: poetry run ruff check .

      - name: Test (against Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/padel
        run: poetry run pytest

      - name: Check migrations match models
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/padel
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  # main → production; pull requests from this repo → one shared staging app with its own database
  # (the last PR pushed wins). Fork PRs get no secrets, so they are skipped.
  deploy:
    needs: test
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      url: https://${{ format(github.event_name == 'pull_request' && '{0}-staging' || '{0}', vars.FLY_APP || 'padelstats-kleist') }}.fly.dev
    permissions:
      contents: read
      actions: read  # download the latest backup artifact for staging
    concurrency:
      group: fly-deploy-${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      FLY_APP: ${{ format(github.event_name == 'pull_request' && '{0}-staging' || '{0}', vars.FLY_APP || 'padelstats-kleist') }}
    steps:
      - name: Check that Fly.io is configured
        id: configured
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN secret is not set — skipping deploy. See docs/SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = staging ] && [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::warning::STAGING_DATABASE_URL secret is not set — skipping staging deploy. See docs/SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.configured.outputs.ok == 'true'

      - name: Create Fly app if it does not exist
        if: steps.configured.outputs.ok == 'true'
        run: flyctl status -a "$FLY_APP" >/dev/null 2>&1 || flyctl apps create "$FLY_APP" --org "$FLY_ORG"

      - name: Sync secrets
        if: steps.configured.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ github.event_name == 'pull_request' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for name in DATABASE_URL ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set. See docs/SETUP.md."; exit 1; fi
          done
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            # Generated once and kept, so logins survive deploys.
            if ! flyctl secrets list -a "$FLY_APP" | grep -q SESSION_SECRET; then
              echo "SESSION_SECRET=$(openssl rand -hex 32)"
            fi
          } | flyctl secrets import --stage -a "$FLY_APP"

      # Staging always starts from the latest nightly production backup. This tests that the backup
      # restores, and runs the PR's migrations (release_command) against real data.
      - name: Restore latest production backup into staging
        if: steps.configured.outputs.ok == 'true' && env.TARGET == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow backup.yml --branch main --status success \
            --limit 1 --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"') \
            || run=""  # backup.yml not on main yet
          if [ -z "$run" ]; then
            echo "::error::No successful Database backup run on main yet. Run Actions → Database backup, then re-run this job."
            exit 1
          fi
          read -r run_id created <<< "$run"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" --dir backup
          dump=$(find backup -name '*.dump' | sort | tail -1)
          if [ -z "$dump" ]; then echo "::error::Backup run $run_id has no .dump artifact"; exit 1; fi
          echo "Restoring $dump (backup run $run_id, $created)"
          # Same Postgres image as the backup workflow. Start from an empty schema so tables left over
          # from an earlier PR's migrations don't survive the restore.
          matches=$(docker run --rm -e STAGING_DATABASE_URL -v "$PWD/backup:/backup:ro" postgres:18 sh -euc "
            psql -v ON_ERROR_STOP=1 -q -d \"\$STAGING_DATABASE_URL\" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
            pg_restore --no-owner --no-acl --exit-on-error -d \"\$STAGING_DATABASE_URL\" '/backup/${dump#backup/}'
            psql -v ON_ERROR_STOP=1 -At -d \"\$STAGING_DATABASE_URL\" -c 'SELECT count(*) FROM matches'
          ")
          echo "::notice::Restored production backup from $created into staging: $matches matches"

      - name: Deploy
        if: steps.configured.outputs.ok == 'true'
        run: flyctl deploy --remote-only --ha=false -a "$FLY_APP" --build-arg GIT_SHA="$GITHUB_SHA"

      - name: Smoke test
        if: steps.configured.outputs.ok == 'true'
        run: |
          url="https://$FLY_APP.fly.dev/healthz/db"
          for i in $(seq 1 10); do
            body=$(curl -fsS "$url" || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\""; then
              echo "::notice::Deployed $GITHUB_SHA to https://$FLY_APP.fly.dev"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$url did not report version $GITHUB_SHA"
          exit 1
