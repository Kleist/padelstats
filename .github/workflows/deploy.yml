name: Deploy to GitHub Pages

# The stats now live in the web app (Fly.io). GitHub Pages only forwards old
# links (kleist.github.io/padelstats/...) to it.

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build redirect page
        env:
          APP_URL: https://${{ vars.FLY_APP || 'padelstats-kleist' }}.fly.dev/
        run: |
          mkdir dist
          sed "s|__APP_URL__|$APP_URL|g" redirect/index.html > dist/index.html
          # Pages serves 404.html for any other path, so old deep links forward too.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
