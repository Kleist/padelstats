[project]
name = "padelstats"
version = "0.1.0"
description = "Padel stats static site generator"
authors = [
    {name = "Andreas Helbech Kleist"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "alembic (>=1.13,<2.0)",
    "python-multipart (>=0.0.9)",
    "itsdangerous (>=2.2,<3.0)"
]


[project.optional-dependencies]
dev = ["pytest (>=8.0,<9.0)", "ruff (>=0.8,<1.0)", "httpx (>=0.27,<1.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
